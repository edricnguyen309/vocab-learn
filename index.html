<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vocab">
    <meta name="theme-color" content="#007AFF">
    <meta name="description" content="Learn vocabulary in different languages">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Vocabulary Learning</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="menu-bar">
        <div class="menu-left"></div>
        <div class="menu-right">
            <button class="refresh-btn">
                <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
                </svg>
            </button>
            <button class="avatar-btn">
                <svg class="avatar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </button>
        </div>
    </nav>
    <div class="container">
        <div class="home-content">
            <h1>Welcome to Vocabulary Learning</h1>
            <p>Choose a language to start learning:</p>
            <div class="language-options">
                <button class="language-btn" data-language="english">English</button>
                <button class="language-btn" data-language="swedish">Swedish</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
